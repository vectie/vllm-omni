    profiler_config:
      profiler: torch
      torch_profiler_dir: /tmp/vllm-omni-profiles/minicpmo45/a2-cfm3-current-stage1
      torch_profiler_record_shapes: true
      torch_profiler_with_memory: false
      torch_profiler_with_stack: false
