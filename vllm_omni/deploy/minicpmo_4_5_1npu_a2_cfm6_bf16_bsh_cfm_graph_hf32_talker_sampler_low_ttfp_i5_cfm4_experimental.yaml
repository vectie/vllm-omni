# Atlas 800I A2 single-chip minimum-useful first packet candidate.
#
# Five new codec codes plus the retained three-code left context give the flow
# encoder eight input frames. After its three-frame lookahead this becomes ten
# mel frames; HiFT keeps eight mel frames (3840 samples) for overlap and can
# therefore publish one real 40 ms packet. Four new codes would produce no
# publishable waveform, making five the architectural lower bound without
# changing HiFT's continuity contract. Precompile width 10 through the same
# MLP, attention-preamble and prompt Conv+MLP graph chain used by larger chunks.

base_config: minicpmo_4_5_1npu_a2_cfm6_bf16_bsh_cfm_graph_hf32_talker_sampler_low_ttfp_cfm4_experimental.yaml

platforms:
  npu:
    stages:
      - stage_id: 1
        env:
          VLLM_OMNI_MINICPMO45_NPU_CODEC_SAMPLER_GRAPH: "1"
          VLLM_OMNI_MINICPMO45_INITIAL_CODEC_CHUNK_FRAMES: "5"
      - stage_id: 2
        env:
          VLLM_OMNI_MINICPMO45_NPU_INITIAL_CFM_TIMESTEPS: "4"
          VLLM_OMNI_MINICPMO45_NPU_DIT_GRAPH_BUCKETS: "10,20,302"
