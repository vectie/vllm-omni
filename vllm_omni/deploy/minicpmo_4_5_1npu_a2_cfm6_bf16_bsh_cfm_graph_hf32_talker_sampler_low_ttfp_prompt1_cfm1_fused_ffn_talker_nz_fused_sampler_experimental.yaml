# Batch-one Talker full-graph sampler fusion candidate for Atlas A2.
#
# The retained baseline launches one captured Talker backbone and one captured
# codec sampler for every generated codec token. This opt-in path stages RNG
# and repetition-window inputs into fixed slabs, writes the sampled token from
# the outer Talker graph, and consumes it without a second graph replay.

base_config: minicpmo_4_5_1npu_a2_cfm6_bf16_bsh_cfm_graph_hf32_talker_sampler_low_ttfp_prompt1_cfm1_fused_ffn_talker_nz_experimental.yaml

platforms:
  npu:
    stages:
      - stage_id: 1
        env:
          VLLM_OMNI_MINICPMO45_NPU_CODEC_SAMPLER_GRAPH: "1"
          VLLM_OMNI_MINICPMO45_INITIAL_CODEC_CHUNK_FRAMES: "10"
          VLLM_OMNI_MINICPMO45_NPU_BATCHED_CODEC_OUTPUT: "1"
          VLLM_OMNI_MINICPMO45_DIRECT_STOP_SAMPLER: "1"
          VLLM_OMNI_MINICPMO45_CODEC_CHUNK_FRAMES: "25"
          VLLM_OMNI_MINICPMO45_NPU_FUSED_CODEC_SAMPLER: "1"
