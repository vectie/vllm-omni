# Batch-one Talker decode candidate for Atlas A2.
#
# The generic vLLM slot-mapping Triton program clears the complete preallocated
# slot slab on every codec token.  The competition workload serves one request
# and schedules one Talker token at a time, so use the opt-in scalar mapping
# kernel from our vLLM-Ascend fork.  Prefill, batching, DCP and speculative
# decode continue to use the generic implementation.

base_config: minicpmo_4_5_1npu_a2_cfm6_bf16_bsh_cfm_graph_hf32_talker_sampler_low_ttfp_prompt1_cfm1_fused_ffn_talker_nz_experimental.yaml

platforms:
  npu:
    stages:
      - stage_id: 1
        env:
          VLLM_ASCEND_SINGLE_TOKEN_SLOT_GRAPH: "1"
