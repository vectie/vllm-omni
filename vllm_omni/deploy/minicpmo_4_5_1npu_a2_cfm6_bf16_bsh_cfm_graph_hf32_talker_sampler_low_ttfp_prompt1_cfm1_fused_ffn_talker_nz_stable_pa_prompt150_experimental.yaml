# Atlas 800I A2 bounded DiT prompt-cache candidate.
#
# Seed-TTS reference prompts produce roughly 302 estimator frames before the
# first audio packet. Keep the complete prompt in the tokenizer, Conformer and
# speaker embedding paths, but retain only the final 150 already-contextualized
# hidden/mel frames in the expensive 16-block DiT cache. This changes the
# acoustic prompt-conditioning window and therefore remains accuracy-gated.

base_config: minicpmo_4_5_1npu_a2_cfm6_bf16_bsh_cfm_graph_hf32_talker_sampler_low_ttfp_prompt1_cfm1_fused_ffn_talker_nz_stable_pa_experimental.yaml

platforms:
  npu:
    stages:
      - stage_id: 2
        env:
          VLLM_OMNI_MINICPMO45_NPU_PROMPT_CACHE_MAX_FRAMES: "150"
          VLLM_OMNI_MINICPMO45_NPU_DIT_GRAPH_BUCKETS: "20,150"
