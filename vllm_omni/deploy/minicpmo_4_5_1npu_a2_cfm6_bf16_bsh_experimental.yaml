# Atlas 800I A2 / Ascend 910B single-chip sequence-major DiT candidate.
#
# Preserve the memory-safe A2 stage settings and CFM6 accuracy boundary, but
# keep the DiT/CFM island homogeneous BF16 and store attention projections,
# fixed K/V slabs, fused attention, and output projection in BSH layout. This
# removes steady BSH<->BHSD materializations across all 16 DiT blocks. Prompt
# and tail widths retain exact fallbacks; HiFT stays in FP32/eager mode.

base_config: minicpmo_4_5_1npu_a2_cfm6_canonical_layout_experimental.yaml

connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      # Connector blocks replace rather than deep-merge, so repeat the full
      # A2 control contract and change only the DiT precision/layout island.
      connector_get_sleep_s: 0.01
      connector_get_max_wait_first_chunk: 3000
      connector_get_max_wait: 300
      codec_chunk_frames: 25
      initial_codec_chunk_frames: 25
      codec_left_context_frames: 3
      raw_tensor_shm: false
      shm_event_notifications: true
      shm_notification_namespace: minicpmo45-a2-1npu-bsh
      token2wav_n_timesteps: 6
      npu_dit_mlp_graph: true
      npu_dit_mlp_graph_width: 50
      npu_dit_graph_buckets: [20, 302]
      npu_dit_preamble_graph: true
      npu_dit_wide_adaln: true
      npu_dit_wide_final_adaln: true
      npu_dit_final_addcmul: true
      npu_dit_conv_mlp_graph: true
      npu_dit_prompt_conv_mlp_graph: true
      npu_dit_fused_conv_pack: true
      npu_single_request_cache_passthrough: true
      npu_dit_compute_dtype: bf16
      npu_cfm_integration_dtype: bf16
      npu_cfm_fixed_kv_slabs: true
      npu_cfm_planar_kv_slabs: true
      npu_dit_bsh_attention: true
