# Diagnostic for the rejected inverse-CDF Talker sampler graph. It adds
# device-wide fences before replay and immediately after replay, before output
# copies, to determine whether graph inputs or request sample/frequency outputs
# cross streams without an ordering dependency. Never use this profile for a
# performance claim or submission.

base_config: minicpmo_4_5_1npu_a2_evaluator_fia_bucket16_async_replay_sampler_graph_experimental.yaml

platforms:
  npu:
    stages:
      - stage_id: 1
        env:
          VLLM_OMNI_MINICPMO45_NPU_CODEC_SAMPLER_SYNC: "1"
