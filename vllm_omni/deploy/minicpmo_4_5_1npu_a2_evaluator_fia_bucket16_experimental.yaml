# A2 evaluator-compatible isolation profile for the quality-gated FIA
# sequence-length bucket. Stage 1 (Talker) keeps a fixed tail mask and only
# rebinds its captured attention tasks when a request crosses a 16-token
# boundary or its block-table address changes. The one-chip source policy now
# selects the same value by default; this profile remains for controlled A/Bs.

base_config: minicpmo_4_5_1npu_a2_evaluator_compat.yaml

platforms:
  npu:
    stages:
      - stage_id: 1
        additional_config:
          enable_cpu_binding: false
          ascend_compilation_config:
            fuse_norm_quant: false
          fia_graph_seq_len_bucket_size: 16
