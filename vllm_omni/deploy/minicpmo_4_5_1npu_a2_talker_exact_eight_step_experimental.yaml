# Exact eight-step Talker candidate.
#
# Reserves seven lookahead KV slots and executes at most eight real target
# steps. This is deliberately separate from the four-step profile so it can be
# rejected independently when larger command bursts hurt latency or fairness.

base_config: minicpmo_4_5_1npu_a2_talker_exact_four_step_experimental.yaml

platforms:
  npu:
    stages:
      - stage_id: 1
        env:
          VLLM_OMNI_MINICPMO45_TALKER_EXACT_STEPS: "8"
          VLLM_OMNI_MINICPMO45_TALKER_EXACT_TWO_STEP: "1"
