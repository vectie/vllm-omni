# Exact twenty-four-step Talker candidate.
#
# Twenty-four is the useful ceiling for the 25-codec-frame publication
# window: the next real step must return to the scheduler so the chunk can be
# published. Larger reservations cannot remove another steady boundary.

base_config: minicpmo_4_5_1npu_a2_talker_exact_sixteen_step_experimental.yaml

platforms:
  npu:
    stages:
      - stage_id: 1
        env:
          VLLM_OMNI_MINICPMO45_TALKER_EXACT_STEPS: "24"
          VLLM_OMNI_MINICPMO45_TALKER_EXACT_TWO_STEP: "1"
