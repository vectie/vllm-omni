# Single-chip A2 isolation profile for a precise FULL-graph replay fence.
# Before host-side graph-task mutation, Talker waits only for the previous
# replay completion event rather than synchronizing the complete model stream.
# Keep opt-in until official-shape RTF, TTFP and quality gates pass.

base_config: minicpmo_4_5_1npu_a2_evaluator_fia_bucket16_experimental.yaml

stages:
  - stage_id: 0
    env:
      # CANN 9.0 on the competition A2 registers the wrapper but its 910B
      # operator package does not provide aclnnAddRmsNormBias.  Opt out only
      # of this kernel; keep the MiniCPM-specific custom kernels enabled.
      VLLM_ASCEND_ENABLE_ADD_RMS_NORM_BIAS: "0"
  - stage_id: 1
    env:
      VLLM_ASCEND_ENABLE_ADD_RMS_NORM_BIAS: "0"
      VLLM_ASCEND_FULL_GRAPH_PRECISE_REPLAY_FENCE: "1"
