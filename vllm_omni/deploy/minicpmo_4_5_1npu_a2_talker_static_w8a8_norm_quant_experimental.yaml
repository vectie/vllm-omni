# A2 static-W8A8 Talker candidate with graph-visible RMSNorm quantization.
#
# The calibrated gate/up projection consumes the post-attention RMSNorm output.
# Enabling both compiler views lets vLLM-Ascend replace the separate norm and
# fixed quantizer with one norm-quant producer before the INT8 Cube matmul.

base_config: minicpmo_4_5_1npu_a2_evaluator_fia_bucket16_experimental.yaml

platforms:
  npu:
    stages:
      - stage_id: 1
        env:
          VLLM_DISABLE_COMPILE_CACHE: "1"
        additional_config:
          ascend_compilation_config:
            fuse_norm_quant: true
        compilation_config:
          pass_config:
            fuse_norm_quant: true
