# Atlas 800I A3 / Ascend 910C 25/32-frame streaming candidate.
#
# Preserve the accepted 25-frame first packet and its width-50 DiT/F0 graphs
# for TTFP, then use 32 codec frames for steady packets. The corresponding
# steady DiT and HiFT widths are 64 and 72; compile both while retaining the
# accepted prompt/final buckets and every accepted Stage-2 optimization.

base_config: minicpmo_4_5_2npu_910c_cfm6_dit_prompt_graph_buckets_experimental.yaml

connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      connector_get_sleep_s: 0.01
      connector_get_max_wait_first_chunk: 3000
      connector_get_max_wait: 300
      codec_chunk_frames: 32
      initial_codec_chunk_frames: 25
      codec_left_context_frames: 3
      raw_tensor_shm: false
      shm_event_notifications: true
      shm_notification_namespace: minicpmo45-910c
      token2wav_n_timesteps: 6
      npu_dit_mlp_graph: true
      npu_dit_mlp_graph_width: 64
      npu_dit_graph_buckets: [20, 50, 302]
      npu_dit_preamble_graph: true
      npu_dit_wide_adaln: true
      npu_dit_conv_mlp_graph: true
      npu_dit_prompt_conv_mlp_graph: true
      npu_dit_fused_conv_pack: true
      npu_single_request_cache_passthrough: true

platforms:
  npu:
    stages:
      - stage_id: 2
        env:
          VLLM_OMNI_MINICPMO45_NPU_HIFT_F0_GRAPH_WIDTH: "72"
          # The preserved 25-frame first packet reaches HiFT at width 50.
          VLLM_OMNI_MINICPMO45_NPU_HIFT_F0_GRAPH_BUCKETS: "50"
