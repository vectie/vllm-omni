# Atlas 800I A3 / Ascend 910C sequence-major DiT attention experiment.
#
# Retain the accepted homogeneous-BF16 and fixed planar slab ownership, but
# store Q/K/V as BSH across projection, cache append, fused attention, and the
# output projection. This removes the repeated BSH<->BHSD transposes from all
# 16 blocks. The feature is fail-closed and remains opt-in until a loaded-
# checkpoint parity gate and repeated serving A/B accept it.

base_config: minicpmo_4_5_2npu_910c_cfm6_dit_bf16_planar_kv_experimental.yaml

connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      # Top-level connector definitions replace the base connector rather than
      # deep-merging it. Keep the complete accepted planar profile here so this
      # candidate changes only the attention layout.
      connector_get_sleep_s: 0.01
      connector_get_max_wait_first_chunk: 3000
      connector_get_max_wait: 300
      codec_chunk_frames: 25
      codec_left_context_frames: 3
      raw_tensor_shm: false
      shm_event_notifications: true
      shm_notification_namespace: minicpmo45-910c
      token2wav_n_timesteps: 6
      npu_dit_mlp_graph: true
      npu_dit_mlp_graph_width: 50
      npu_dit_graph_buckets: [20, 302]
      npu_dit_preamble_graph: true
      npu_dit_wide_adaln: true
      npu_dit_wide_final_adaln: true
      npu_dit_final_addcmul: true
      npu_dit_conv_mlp_graph: true
      npu_dit_prompt_conv_mlp_graph: true
      npu_dit_fused_conv_pack: true
      npu_single_request_cache_passthrough: true
      npu_dit_compute_dtype: bf16
      npu_cfm_integration_dtype: bf16
      npu_cfm_fixed_kv_slabs: true
      npu_cfm_planar_kv_slabs: true
      npu_dit_bsh_attention: true
