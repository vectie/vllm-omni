# Atlas 800I A3 / Ascend 910C graph-visible causal-Conv experiment.
#
# The flag still identifies the aggressive research profile, but graph replay
# now selects the canonical causal-pack Conv+MLP partition directly. Only the
# two layout transforms remain custom nodes; both GEMMs, LayerNorm, Mish,
# gated residual, cache assembly, and MLP are visible to GE. The MIX_AIC_1_2
# block remains available for eager kernel research but is never inserted as
# an opaque node into the resident graph. See the benchmark report.

base_config: minicpmo_4_5_2npu_910c_cfm6_dit_megagraph_competition.yaml

connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      connector_get_sleep_s: 0.01
      connector_get_max_wait_first_chunk: 3000
      connector_get_max_wait: 300
      codec_chunk_frames: 25
      codec_left_context_frames: 3
      raw_tensor_shm: false
      shm_event_notifications: true
      shm_notification_namespace: minicpmo45-910c
      token2wav_n_timesteps: 6
      npu_dit_mlp_graph: true
      npu_dit_mlp_graph_width: 50
      npu_dit_preamble_graph: true
      npu_dit_conv_mlp_graph: true
      npu_dit_fused_conv_pack: true
      npu_dit_fused_conv_block: true
