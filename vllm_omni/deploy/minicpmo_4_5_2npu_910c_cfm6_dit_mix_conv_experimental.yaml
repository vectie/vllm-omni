# Atlas 800I A3 / Ascend 910C mixed-core causal-Conv experiment.
#
# Replaces the two native pack operators and external Conv projections with
# one FP32 MIX_AIC_1_2 kernel. A 2026-08-14 resident Seed-TTS comparison
# regressed serving duration by 31.88% against the native-pack megagraph, so
# this profile is deliberately experimental and must not be used as the
# competition default. See the benchmark report for the complete result.

base_config: minicpmo_4_5_2npu_910c_cfm6_dit_megagraph_competition.yaml

connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      connector_get_sleep_s: 0.01
      connector_get_max_wait_first_chunk: 3000
      connector_get_max_wait: 300
      codec_chunk_frames: 25
      codec_left_context_frames: 3
      raw_tensor_shm: false
      shm_event_notifications: true
      shm_notification_namespace: minicpmo45-910c
      token2wav_n_timesteps: 6
      npu_dit_mlp_graph: true
      npu_dit_mlp_graph_width: 50
      npu_dit_preamble_graph: true
      npu_dit_conv_mlp_graph: true
      npu_dit_fused_conv_pack: true
      npu_dit_fused_conv_block: true
