# Atlas 800I A3 / Ascend 910C six-step CFM plus fixed-width DiT MLP graph.
#
# The graph covers only the affine-free norm2, MLP, gate, and residual path.
# Attention and internal-format Conv2D stay eager. It is explicit opt-in until
# the complete 1,088-row Seed-TTS, Daily-Omni, and Video-MME gates pass.

base_config: minicpmo_4_5_2npu_910c_cfm6.yaml

# Top-level connector blocks replace the inherited block. Repeat every 910C
# connector setting here so this profile changes only the graph partition.
connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      connector_get_sleep_s: 0.01
      connector_get_max_wait_first_chunk: 3000
      connector_get_max_wait: 300
      codec_chunk_frames: 25
      codec_left_context_frames: 3
      raw_tensor_shm: false
      shm_event_notifications: true
      shm_notification_namespace: minicpmo45-910c
      token2wav_n_timesteps: 6
      npu_dit_mlp_graph: true
      npu_dit_mlp_graph_width: 50
