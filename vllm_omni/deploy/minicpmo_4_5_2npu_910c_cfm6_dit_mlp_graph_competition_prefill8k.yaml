# Atlas 800I A3 / Ascend 910C competition c4 + 8K replay profile.
#
# This preserves the organizer sampling contract and scheduler budget used by
# the accepted 937/1,197 Daily-Omni control. Keep admission and prefix-cache
# experiments based on this file so their recorded 8K measurements remain
# reproducible after the 16K prefill budget is promoted to the default.

base_config: minicpmo_4_5_2npu_910c_cfm6_dit_mlp_graph.yaml

stages:
  - stage_id: 0
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 128
      seed: 42
      detokenize: true
      repetition_penalty: 1.2
