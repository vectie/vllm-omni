# Atlas 800I A3 / Ascend 910C prompt-width DiT graph candidate.
#
# The established streaming path remains the 50-frame fused Conv+MLP graph.
# Setup and finalization also produce stable 302- and 20-frame DiT shapes;
# precompile their attention preamble and MLP partitions while retaining eager
# convolution, including the uncached setup pass. Keep this profile opt-in
# until paired Seed-TTS latency and accuracy gates qualify it.

base_config: minicpmo_4_5_2npu_910c_cfm6_hift_f0_graph_experimental.yaml

connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      connector_get_sleep_s: 0.01
      connector_get_max_wait_first_chunk: 3000
      connector_get_max_wait: 300
      codec_chunk_frames: 25
      codec_left_context_frames: 3
      raw_tensor_shm: false
      shm_event_notifications: true
      shm_notification_namespace: minicpmo45-910c
      token2wav_n_timesteps: 6
      npu_dit_mlp_graph: true
      npu_dit_mlp_graph_width: 50
      npu_dit_graph_buckets: [20, 302]
      npu_dit_preamble_graph: true
      npu_dit_conv_mlp_graph: true
      npu_dit_fused_conv_pack: true
