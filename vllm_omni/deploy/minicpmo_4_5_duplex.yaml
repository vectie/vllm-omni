# MiniCPM-o 4.5 native duplex deployment.
#
# The registered minicpmo_4_5 pipeline owns the fixed
# Thinker -> Talker -> Code2Wav topology. This overlay changes session
# lifetime and bounds all three stages to two live duplex sessions.
base_config: minicpmo_4_5.yaml
pipeline: minicpmo_4_5
session_mode: duplex
active_stream_window: 1
duplex_session:
  idle_ttl_s: 300
  disconnect_grace_s: 30
  reaper_interval_s: 5
  resume_replay_ttl_s: 60
  resume_replay_max_bytes_per_session: 8388608
  max_pending_input_bytes_per_session: 16777216
  max_pending_turns_per_session: 4
  # Matches the configured Stage0/Stage1 sequence capacity below.
  max_sessions: 2
  completed_append_cache_size: 256
  # Established duplex work wins admission, while background requests older
  # than 30 seconds are aged ahead for one turn to prevent starvation.
  foreground_priority: -100
  background_aging_s: 30.0
  # Priority alone cannot displace requests already occupying both Stage-0
  # slots. Reclaim one lower-priority slot at the next token boundary so a
  # committed duplex append does not inherit an offline decode's full tail.
  foreground_preemption: true
  # This profile does not load dynamic LoRA/adapters, so repeated Stage-0
  # delimiter embeddings are safe to keep accelerator-resident.
  cache_control_embeddings: true

stages:
  - stage_id: 0
    max_num_seqs: 2
    async_scheduling: false
    engine_extras:
      scheduling_policy: priority

  - stage_id: 1
    max_num_seqs: 2
    async_scheduling: false
    # The split Talker exposes a binary continue/stop vocabulary; native
    # segment and turn boundaries travel as explicit output metadata.
    default_sampling_params:
      max_tokens: 2048
      min_tokens: 0
      stop_token_ids: [1]

  - stage_id: 2
    max_num_seqs: 2
    async_scheduling: false
